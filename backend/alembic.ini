#wifiplan\backend\alembic.ini
# Alembic configuration for WifiPlan.

[alembic]

# Path to migration scripts.
script_location = alembic

# Template used to generate migration files.
# file_template = %%(rev)s_%%(slug)s

# Add the backend root to the Python path.
prepend_sys_path = .

# Optional timezone for migration filenames.
# timezone = UTC

# Alembic version table.
version_table = alembic_version

# Fallback database URL.
#
# When Alembic runs inside the backend container, "postgres" is the
# Docker Compose service name.
#
# backend/alembic/env.py overrides this value using DATABASE_URL
# when the environment variable is available.
sqlalchemy.url = postgresql://wifiplan:wifiplan@postgres:5432/wifiplan


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S