services:

  postgres:
    image: postgis/postgis:15-3.3
    restart: unless-stopped

    environment:
      POSTGRES_USER: wifiplan
      POSTGRES_PASSWORD: wifiplan
      POSTGRES_DB: wifiplan

    ports:
      - "5432:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifiplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

    environment:

      # ---------------------------
      # Base de datos
      # ---------------------------
      DATABASE_URL: postgresql://wifiplan:wifiplan@postgres:5432/wifiplan

      # ---------------------------
      # Redis / Celery
      # ---------------------------
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # ---------------------------
      # MinIO / S3
      # ---------------------------
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_FLOORPLANS: floorplans
      S3_BUCKET_HEATMAPS: heatmaps
      S3_REGION: us-east-1
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}

      # ---------------------------
      # Seguridad
      # ---------------------------
      SECRET_KEY: change-me-in-production-minimum-32-chars-long

      # ---------------------------
      # Aplicación
      # ---------------------------
      LOG_LEVEL: info
      ENVIRONMENT: development
      API_V1_PREFIX: /api/v1
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

    environment:

      # ---------------------------
      # Base de datos
      # ---------------------------
      DATABASE_URL: postgresql://wifiplan:wifiplan@postgres:5432/wifiplan

      # ---------------------------
      # Redis / Celery
      # ---------------------------
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # ---------------------------
      # MinIO / S3
      # ---------------------------
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_FLOORPLANS: floorplans
      S3_BUCKET_HEATMAPS: heatmaps
      S3_REGION: us-east-1

      SECRET_KEY: change-me-in-production-minimum-32-chars-long
      LOG_LEVEL: info

    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - --loglevel=info
      - -Q
      - cv_pipeline,rf_engine

    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------
  # Servicio Frontend
  # ---------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # La API se accede desde el navegador del usuario, así que usamos localhost
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    command: ["node", "server.js"]  

volumes:
  pg_data:
  minio_data: