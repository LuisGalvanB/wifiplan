
<h2 class="sr-only">Animación OFDM: cómo Wi-Fi divide el canal en cientos de sub-portadoras paralelas ortogonales</h2>
<canvas id="cv2" style="width:100%;display:block;border-radius:10px;"></canvas>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;">
  <button onclick="setView('single')"  id="vs">Portadora única</button>
  <button onclick="setView('ofdm')"    id="vo">OFDM (multi sub-portadora)</button>
  <button onclick="setView('ofdma')"   id="voa" style="border-color:#7F77DD;color:#534AB7;">OFDMA — Wi-Fi 6</button>
  <button onclick="toggleCP()" id="bcp" style="margin-left:auto;">Ver Cyclic Prefix</button>
</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;">
  <div style="background:var(--color-background-secondary);border-radius:8px;padding:8px 10px;">
    <div style="font-size:11px;color:var(--color-text-secondary);">Modo</div>
    <div id="o-mode" style="font-size:15px;font-weight:500;color:var(--color-text-primary);">OFDM</div>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:8px;padding:8px 10px;">
    <div style="font-size:11px;color:var(--color-text-secondary);">Sub-portadoras</div>
    <div id="o-subs" style="font-size:15px;font-weight:500;color:#378ADD;">52</div>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:8px;padding:8px 10px;">
    <div style="font-size:11px;color:var(--color-text-secondary);">Eficiencia espectral</div>
    <div id="o-eff" style="font-size:15px;font-weight:500;color:#1D9E75;">Alta</div>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:8px;padding:8px 10px;">
    <div style="font-size:11px;color:var(--color-text-secondary);">Resistencia multipath</div>
    <div id="o-mp" style="font-size:15px;font-weight:500;color:#1D9E75;">Muy alta</div>
  </div>
</div>
<script>
const cv2=document.getElementById('cv2');
const c2=cv2.getContext('2d');
const DPR=window.devicePixelRatio||1;
const W=680,H=460;
cv2.width=W*DPR; cv2.height=H*DPR; c2.scale(DPR,DPR);
const dark=matchMedia('(prefers-color-scheme:dark)').matches;
const BG=dark?'#141824':'#f5f7ff';
const GRID=dark?'rgba(255,255,255,0.05)':'rgba(0,0,120,0.05)';
const AX=dark?'rgba(255,255,255,0.15)':'rgba(0,0,80,0.2)';
const TXT=dark?'#ccc':'#334';
const TXTS=dark?'#888':'#778';

let view='ofdm', showCP=false, t2=0;

const SUB_COLS=['#378ADD','#5DCAA5','#7F77DD','#EF9F27','#D85A30','#1D9E75','#D4537E','#639922'];
const OFDMA_USERS=[
  {col:'#378ADD',label:'Cliente A',slots:[0,1,2]},
  {col:'#5DCAA5',label:'Cliente B',slots:[3,4]},
  {col:'#7F77DD',label:'Cliente C',slots:[5,6,7]},
  {col:'#EF9F27',label:'Cliente D',slots:[8,9]},
];

function drawBG2(){
  c2.fillStyle=BG; c2.fillRect(0,0,W,H);
  c2.strokeStyle=GRID; c2.lineWidth=1;
  for(let x=0;x<W;x+=30){c2.beginPath();c2.moveTo(x,0);c2.lineTo(x,H);c2.stroke();}
  for(let y=0;y<H;y+=30){c2.beginPath();c2.moveTo(0,y);c2.lineTo(W,y);c2.stroke();}
}

function drawSingleCarrier(){
  const mx=W/2, top=50, bot=H-60, mid=(top+bot)/2, amp=(bot-top)/2*0.55;
  c2.fillStyle='#378ADD'; c2.font='bold 14px sans-serif'; c2.textAlign='center';
  c2.fillText('Portadora única — todo el canal, una sola frecuencia',mx,28);
  c2.fillStyle=TXTS; c2.font='11px sans-serif';
  c2.fillText('Un símbolo de datos ocupa TODA la banda. Si hay interferencia en ese punto → todo se pierde.',mx,44);

  c2.strokeStyle=AX; c2.lineWidth=0.5;
  c2.beginPath(); c2.moveTo(60,mid); c2.lineTo(W-60,mid); c2.stroke();

  // single fat wave
  c2.beginPath();
  for(let px=0;px<=W-120;px+=2){
    const norm=px/(W-120);
    const wy=mid-amp*Math.sin(2*Math.PI*3*norm-t2*2.5);
    if(px===0) c2.moveTo(60+px,wy); else c2.lineTo(60+px,wy);
  }
  c2.strokeStyle='rgba(55,138,221,0.9)'; c2.lineWidth=3; c2.stroke();

  // bandwidth arrow
  c2.strokeStyle='rgba(55,138,221,0.5)'; c2.lineWidth=1;
  c2.beginPath(); c2.moveTo(60,bot+20); c2.lineTo(W-60,bot+20); c2.stroke();
  c2.fillStyle='#378ADD'; c2.font='bold 11px sans-serif'; c2.textAlign='center';
  c2.fillText('← Todo el canal = 20 MHz →',mx,bot+36);

  // problem zone
  const noiseX=60+(W-120)*0.45;
  c2.fillStyle='rgba(226,75,74,0.18)';
  c2.fillRect(noiseX-15,top,30,bot-top);
  c2.strokeStyle='rgba(226,75,74,0.5)'; c2.lineWidth=1; c2.setLineDash([3,3]);
  c2.beginPath(); c2.moveTo(noiseX,top); c2.lineTo(noiseX,bot); c2.stroke();
  c2.setLineDash([]);
  c2.fillStyle='#E24B4A'; c2.font='bold 10px sans-serif'; c2.textAlign='center';
  c2.fillText('Interferencia',noiseX,top+16);
  c2.fillText('→ señal corrompida',noiseX,top+28);

  // problem indicator
  c2.fillStyle='rgba(226,75,74,0.7)';
  c2.beginPath(); c2.arc(noiseX, mid, 10, 0, Math.PI*2); c2.fill();
  c2.fillStyle='white'; c2.font='bold 12px sans-serif'; c2.textAlign='center';
  c2.fillText('!', noiseX, mid+4);

  c2.fillStyle=TXT; c2.font='11px sans-serif'; c2.textAlign='center';
  c2.fillText('Desventaja: 1 símbolo largo → muy sensible a multipath y ruido de banda estrecha',mx,H-20);
}

function drawOFDM(){
  const nsubs=10;
  const margin=60, top=60, bot=H-90;
  const subW=(W-margin*2)/nsubs;
  const symH=bot-top;
  const mx=W/2;

  c2.fillStyle='#378ADD'; c2.font='bold 14px sans-serif'; c2.textAlign='center';
  c2.fillText('OFDM — '+nsubs+' sub-portadoras ortogonales en paralelo',mx,24);
  c2.fillStyle=TXTS; c2.font='11px sans-serif';
  c2.fillText('Cada sub-portadora transmite independientemente. Si una falla, las demás siguen — resistente a multipath.',mx,40);

  // draw each subcarrier
  for(let i=0;i<nsubs;i++){
    const sx=margin+i*subW;
    const midY=top+symH/2;
    const amp=symH*0.3*(0.7+0.3*Math.sin(i*1.3));
    const freq=1+i*0.3;
    const phase=i*0.7;
    const col=SUB_COLS[i%SUB_COLS.length];

    // subcarrier bg
    c2.fillStyle=dark?`rgba(255,255,255,0.02)`:`rgba(0,0,120,0.02)`;
    c2.strokeStyle=dark?'rgba(255,255,255,0.06)':'rgba(0,0,120,0.08)';
    c2.lineWidth=0.5;
    c2.beginPath(); c2.rect(sx,top,subW,symH); c2.fill(); c2.stroke();

    // axis
    c2.strokeStyle=AX; c2.lineWidth=0.5;
    c2.beginPath(); c2.moveTo(sx,midY); c2.lineTo(sx+subW,midY); c2.stroke();

    // wave
    c2.beginPath();
    for(let px=2;px<=subW-2;px+=1.5){
      const norm=px/subW;
      const wy=midY-amp*Math.sin(freq*Math.PI*2*norm-t2*2+phase);
      if(px===2) c2.moveTo(sx+px,wy); else c2.lineTo(sx+px,wy);
    }
    const [r,g,b]=[parseInt(col.slice(1,3),16),parseInt(col.slice(3,5),16),parseInt(col.slice(5,7),16)];
    c2.strokeStyle=`rgba(${r},${g},${b},0.85)`; c2.lineWidth=2; c2.stroke();

    // sub-carrier label
    c2.fillStyle=col; c2.font='bold 10px sans-serif'; c2.textAlign='center';
    c2.fillText('f'+(i+1),sx+subW/2,top-6);

    // data label
    const bits=['10','01','11','00','10','11','01','00','10','01'][i];
    c2.fillStyle=col; c2.font='bold 9px sans-serif';
    c2.fillText(bits,sx+subW/2,bot+14);
  }

  // cyclic prefix overlay
  if(showCP){
    const cpW=subW*0.25;
    for(let i=0;i<nsubs;i++){
      const sx=margin+i*subW;
      c2.fillStyle='rgba(239,159,39,0.25)';
      c2.fillRect(sx,top,cpW,symH);
      c2.strokeStyle='rgba(239,159,39,0.7)'; c2.lineWidth=1; c2.setLineDash([2,2]);
      c2.beginPath(); c2.moveTo(sx+cpW,top); c2.lineTo(sx+cpW,bot); c2.stroke();
      c2.setLineDash([]);
    }
    c2.fillStyle='#EF9F27'; c2.font='bold 10px sans-serif'; c2.textAlign='center';
    c2.fillText('CP',margin+subW*0.12,top-6);
    c2.fillStyle=TXTS; c2.font='10px sans-serif';
    c2.fillText('Cyclic Prefix (copia del final del símbolo) — absorbe el retardo multipath',mx,bot+32);
  }

  c2.fillStyle=TXT; c2.font='10px sans-serif'; c2.textAlign='center';
  c2.fillText('← bits por sub-portadora →',mx,bot+(!showCP?18:46));

  // ortogonality note
  c2.fillStyle=TXTS; c2.font='11px sans-serif'; c2.textAlign='center';
  c2.fillText('Ortogonalidad: el pico de cada sub-portadora coincide con el cruce por cero de las demás → sin interferencia entre sub-portadoras (ICI=0)',mx,H-16);
}

function drawOFDMA(){
  const nsubs=10, ntime=4;
  const margin=60, top=70, bot=H-60;
  const subW=(W-margin*2)/nsubs;
  const timeH=(bot-top)/ntime;
  const mx=W/2;

  c2.fillStyle='#7F77DD'; c2.font='bold 14px sans-serif'; c2.textAlign='center';
  c2.fillText('OFDMA — Wi-Fi 6: múltiples clientes en paralelo',mx,24);
  c2.fillStyle=TXTS; c2.font='11px sans-serif';
  c2.fillText('Cada cliente recibe un subconjunto de sub-portadoras (Resource Unit). Todos transmiten simultáneamente.',mx,40);

  // axis labels
  c2.fillStyle=TXTS; c2.font='11px sans-serif'; c2.textAlign='center';
  c2.fillText('Sub-portadoras (frecuencia) →',mx,bot+20);
  c2.save(); c2.translate(38,top+(bot-top)/2); c2.rotate(-Math.PI/2);
  c2.fillText('Tiempo →',0,0); c2.restore();

  for(let row=0;row<ntime;row++){
    const ty=top+row*timeH;
    OFDMA_USERS.forEach(u=>{
      u.slots.forEach(s=>{
        const sx=margin+s*subW;
        const pulse=0.75+0.25*Math.sin(t2*2+s*0.5+row*0.7);
        const [r,g,b]=[parseInt(u.col.slice(1,3),16),parseInt(u.col.slice(3,5),16),parseInt(u.col.slice(5,7),16)];
        c2.fillStyle=`rgba(${r},${g},${b},${(pulse*0.45).toFixed(2)})`;
        c2.strokeStyle=`rgba(${r},${g},${b},0.8)`;
        c2.lineWidth=1;
        c2.beginPath(); c2.rect(sx+1,ty+1,subW-2,timeH-2); c2.fill(); c2.stroke();

        if(timeH>24){
          const wave_amp=(timeH-8)*0.3;
          const midWy=ty+timeH/2;
          c2.beginPath();
          for(let px=3;px<=subW-3;px+=2){
            const norm=px/subW;
            const wy=midWy-wave_amp*Math.sin(3*Math.PI*2*norm-t2*2.5+s);
            if(px===3) c2.moveTo(sx+px,wy); else c2.lineTo(sx+px,wy);
          }
          c2.strokeStyle=`rgba(${r},${g},${b},0.9)`; c2.lineWidth=1.5; c2.stroke();
        }
      });
    });
    // time label
    c2.fillStyle=TXTS; c2.font='10px sans-serif'; c2.textAlign='left';
    c2.fillText('t'+(row+1),42,ty+timeH/2+4);
  }

  // frequency axis labels
  for(let i=0;i<nsubs;i++){
    c2.fillStyle=TXTS; c2.font='9px sans-serif'; c2.textAlign='center';
    c2.fillText('f'+(i+1), margin+i*subW+subW/2, top-8);
  }

  // legend
  const legY=bot+36, legX=margin;
  OFDMA_USERS.forEach((u,i)=>{
    const lx=legX+i*(W-margin*2)/4;
    const [r,g,b]=[parseInt(u.col.slice(1,3),16),parseInt(u.col.slice(3,5),16),parseInt(u.col.slice(5,7),16)];
    c2.fillStyle=`rgba(${r},${g},${b},0.5)`;
    c2.beginPath(); c2.roundRect(lx,legY,12,12,3); c2.fill();
    c2.strokeStyle=u.col; c2.lineWidth=1;
    c2.beginPath(); c2.roundRect(lx,legY,12,12,3); c2.stroke();
    c2.fillStyle=TXT; c2.font='11px sans-serif'; c2.textAlign='left';
    c2.fillText(u.label+' ('+u.slots.length+' RUs)',lx+15,legY+10);
  });

  if(typeof c2.roundRect==='undefined'){
    c2.fillRect=c2.fillRect;
  }
}

function frame2(){
  t2+=0.016;
  drawBG2();
  if(view==='single') drawSingleCarrier();
  else if(view==='ofdm') drawOFDM();
  else drawOFDMA();
  requestAnimationFrame(frame2);
}

const VINFO={
  single:{mode:'Portadora única',subs:'1',eff:'Baja',mp:'Baja'},
  ofdm:{mode:'OFDM',subs:'52–256',eff:'Alta',mp:'Muy alta'},
  ofdma:{mode:'OFDMA (Wi-Fi 6)',subs:'por usuario',eff:'Máxima',mp:'Muy alta'},
};
function setView(v){
  view=v;
  const i=VINFO[v];
  document.getElementById('o-mode').textContent=i.mode;
  document.getElementById('o-subs').textContent=i.subs;
  document.getElementById('o-eff').textContent=i.eff;
  document.getElementById('o-mp').textContent=i.mp;
  document.getElementById('o-eff').style.color=v==='single'?'#E24B4A':'#1D9E75';
  document.getElementById('o-mp').style.color=v==='single'?'#EF9F27':'#1D9E75';
}
function toggleCP(){
  showCP=!showCP;
  document.getElementById('bcp').textContent=showCP?'Ocultar Cyclic Prefix':'Ver Cyclic Prefix';
}
if(c2.roundRect===undefined){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();
  };
}
setView('ofdm');
frame2();
</script>
