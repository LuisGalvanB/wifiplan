
<h2 class="sr-only">Animación de transmisión Wi-Fi: cómo viajan las ondas de radio desde un router hasta un cliente</h2>
<canvas id="c" style="width:100%;display:block;border-radius:12px;"></canvas>

<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;">
  <button id="btn-play" style="font-size:13px;" onclick="togglePlay()"><i class="ti ti-player-pause" aria-hidden="true"></i> Pausar</button>
  <button style="font-size:13px;" onclick="setMode('normal')">2.4 GHz</button>
  <button style="font-size:13px;" onclick="setMode('fast')">5 GHz</button>
  <button style="font-size:13px;" onclick="setMode('ultra')">6 GHz</button>
  <button style="font-size:13px;" onclick="toggleWall()"><i class="ti ti-layout-sidebar-left-expand" aria-hidden="true"></i> <span id="wall-btn-txt">Agregar pared</span></button>
  <span id="info-badge" style="margin-left:auto;font-size:12px;color:var(--color-text-secondary);background:var(--color-background-secondary);padding:4px 10px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);">2.4 GHz — 3 canales no solapados</span>
</div>

<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;" id="stats-row">
  <div style="background:var(--color-background-secondary);border-radius:8px;padding:8px 10px;">
    <div style="font-size:11px;color:var(--color-text-secondary);">Frecuencia</div>
    <div id="s-freq" style="font-size:16px;font-weight:500;color:var(--color-text-primary);">2.4 GHz</div>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:8px;padding:8px 10px;">
    <div style="font-size:11px;color:var(--color-text-secondary);">Longitud de onda</div>
    <div id="s-wave" style="font-size:16px;font-weight:500;color:var(--color-text-primary);">12.5 cm</div>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:8px;padding:8px 10px;">
    <div style="font-size:11px;color:var(--color-text-secondary);">Penetración</div>
    <div id="s-pen" style="font-size:16px;font-weight:500;color:var(--color-text-primary);">Alta</div>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:8px;padding:8px 10px;">
    <div style="font-size:11px;color:var(--color-text-secondary);">RSSI simulado</div>
    <div id="s-rssi" style="font-size:16px;font-weight:500;color:#1D9E75;">-45 dBm</div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const DPR = window.devicePixelRatio || 1;
const W = 680, H = 340;
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);

const isDark = matchMedia('(prefers-color-scheme: dark)').matches;

const PALETTE = {
  bg: isDark ? '#1a1a2e' : '#f0f4ff',
  floor: isDark ? '#2a2a3e' : '#dde4f0',
  wall: isDark ? '#4a3a2a' : '#c8b090',
  wallEdge: isDark ? '#6a5a4a' : '#a09070',
  router: isDark ? '#1a3a5a' : '#e6f1fb',
  routerEdge: '#378ADD',
  client: isDark ? '#1a3a2a' : '#e1f5ee',
  clientEdge: '#1D9E75',
  text: isDark ? '#e0e0e0' : '#1a2a3a',
  textMuted: isDark ? '#888' : '#666',
};

const MODES = {
  normal: { freq: '2.4 GHz', waveLen: '12.5 cm', color: '#5DCAA5', speed: 1.4, rings: 6, pen: 'Alta',   info: '2.4 GHz — 3 canales no solapados', label: '2.4 GHz' },
  fast:   { freq: '5 GHz',   waveLen: '6 cm',    color: '#378ADD', speed: 2.2, rings: 5, pen: 'Media',  info: '5 GHz — 25 canales no solapados',  label: '5 GHz' },
  ultra:  { freq: '6 GHz',   waveLen: '5 cm',    color: '#7F77DD', speed: 2.8, rings: 4, pen: 'Baja',   info: '6 GHz — 59 canales (Wi-Fi 6E/7)',  label: '6 GHz' },
};

let mode = MODES.normal;
let playing = true;
let wallVisible = false;
let t = 0;
let packets = [];
let lastPacket = 0;
let rssi = -45;

const ROUTER = { x: 90, y: H / 2 };
const CLIENT = { x: 590, y: H / 2 };
const WALL_X = 320;
const WALL_W = 18;
const WALL_H = 180;

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function drawBackground() {
  ctx.fillStyle = PALETTE.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = PALETTE.floor;
  ctx.fillRect(0, H - 50, W, 50);

  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,100,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H - 50); ctx.stroke();
  }
  for (let y = 0; y < H - 50; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawWall() {
  if (!wallVisible) return;
  const wy = (H - 50 - WALL_H) / 2;
  ctx.fillStyle = PALETTE.wall;
  ctx.fillRect(WALL_X - WALL_W/2, wy, WALL_W, WALL_H + (H - 50 - wy - WALL_H));
  ctx.strokeStyle = PALETTE.wallEdge;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(WALL_X - WALL_W/2, wy, WALL_W, WALL_H + (H - 50 - wy - WALL_H));

  const brickH = 20, brickW = WALL_W;
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
  ctx.lineWidth = 0.5;
  for (let by = wy; by < H - 50; by += brickH) {
    ctx.beginPath(); ctx.moveTo(WALL_X - WALL_W/2, by); ctx.lineTo(WALL_X + WALL_W/2, by); ctx.stroke();
  }

  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.7)' : 'rgba(60,30,10,0.7)';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('PARED', WALL_X, wy - 6);
  ctx.fillText(`-13 dB`, WALL_X, wy - 18);
}

function drawRipples() {
  const maxR = 220;
  const numRings = mode.rings;
  for (let i = 0; i < numRings; i++) {
    const phase = (t * mode.speed * 0.6 + i / numRings) % 1;
    const r = phase * maxR;
    const alpha = (1 - phase) * 0.55;

    if (wallVisible && r > ROUTER.x + 10) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, WALL_X - WALL_W/2, H);
      ctx.clip();
    }

    ctx.beginPath();
    ctx.arc(ROUTER.x, ROUTER.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${hexToRgb(mode.color)},${alpha.toFixed(2)})`;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    if (wallVisible && r > ROUTER.x + 10) {
      ctx.restore();

      const attenuatedAlpha = alpha * (mode === MODES.normal ? 0.5 : mode === MODES.fast ? 0.3 : 0.15);
      if (attenuatedAlpha > 0.04) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(WALL_X + WALL_W/2, 0, W, H);
        ctx.clip();
        ctx.beginPath();
        ctx.arc(ROUTER.x, ROUTER.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${hexToRgb(mode.color)},${attenuatedAlpha.toFixed(2)})`;
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();
      }
    }
  }
}

function drawSineWave() {
  const y0 = H / 2;
  const amp = 18;
  const waveColor = mode.color;
  const cycles = mode === MODES.normal ? 4 : mode === MODES.fast ? 6 : 8;

  ctx.save();
  if (wallVisible) {
    ctx.beginPath();
    ctx.rect(ROUTER.x + 20, 0, WALL_X - WALL_W/2 - ROUTER.x - 20, H);
    ctx.clip();
  }

  ctx.beginPath();
  const x0 = ROUTER.x + 20;
  const x1 = wallVisible ? WALL_X - WALL_W/2 : CLIENT.x - 20;
  for (let px = x0; px <= x1; px += 2) {
    const norm = (px - x0) / (x1 - x0);
    const fade = Math.sin(norm * Math.PI) * 0.85;
    const wave = amp * Math.sin(cycles * Math.PI * 2 * norm - t * mode.speed * 3.5);
    if (px === x0) ctx.moveTo(px, y0 + wave);
    else ctx.lineTo(px, y0 + wave);
  }
  ctx.strokeStyle = `rgba(${hexToRgb(waveColor)},0.7)`;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  if (wallVisible) {
    const attAmp = amp * (mode === MODES.normal ? 0.45 : mode === MODES.fast ? 0.25 : 0.1);
    if (attAmp > 1) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(WALL_X + WALL_W/2, 0, CLIENT.x - 20 - (WALL_X + WALL_W/2), H);
      ctx.clip();
      ctx.beginPath();
      const xa = WALL_X + WALL_W/2;
      const xb = CLIENT.x - 20;
      for (let px = xa; px <= xb; px += 2) {
        const norm = (px - xa) / (xb - xa);
        const wave = attAmp * Math.sin(cycles * Math.PI * 2 * norm - t * mode.speed * 3.5 + 1);
        if (px === xa) ctx.moveTo(px, y0 + wave);
        else ctx.lineTo(px, y0 + wave);
      }
      ctx.strokeStyle = `rgba(${hexToRgb(waveColor)},0.45)`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
  }
}

function drawPackets() {
  packets = packets.filter(p => p.x < CLIENT.x - 10);
  packets.forEach(p => {
    if (wallVisible && p.x >= WALL_X - WALL_W/2 && p.x <= WALL_X + WALL_W/2) {
      p.x += 0.5;
      return;
    }
    if (wallVisible && p.x > WALL_X) {
      p.x += p.speed * 0.4;
    } else {
      p.x += p.speed;
    }

    const alpha = wallVisible && p.x > WALL_X ? 0.55 : 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y + Math.sin(p.x * 0.05) * 6, 5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${hexToRgb(mode.color)},${alpha})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,0.5)`;
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.font = 'bold 8px sans-serif';
    ctx.fillStyle = `rgba(${hexToRgb(mode.color)},${alpha})`;
    ctx.textAlign = 'center';
    ctx.fillText('1', p.x, p.y + Math.sin(p.x * 0.05) * 6 - 9);
  });

  if (t - lastPacket > 0.6 / mode.speed) {
    packets.push({ x: ROUTER.x + 24, y: ROUTER.y - 4 + (Math.random()-0.5)*10, speed: 1.8 * mode.speed });
    lastPacket = t;
  }
}

function drawDevice(x, y, isRouter) {
  const col = isRouter ? PALETTE.routerEdge : PALETTE.clientEdge;
  const bg = isRouter ? PALETTE.router : PALETTE.client;

  ctx.fillStyle = bg;
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;

  if (isRouter) {
    ctx.beginPath();
    ctx.roundRect(x - 22, y - 20, 44, 40, 6);
    ctx.fill(); ctx.stroke();

    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - 6, y - 20); ctx.lineTo(x - 10, y - 36); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 6, y - 20); ctx.lineTo(x + 10, y - 36); ctx.stroke();

    ctx.fillStyle = col;
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ROUTER', x, y + 35);
    ctx.fillText('Wi-Fi 6', x, y + 47);

    const pulse = 0.5 + 0.5 * Math.sin(t * 4);
    ctx.fillStyle = `rgba(${hexToRgb(col)},${pulse.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(x, y + 2, 4, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.roundRect(x - 16, y - 24, 32, 48, 4);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,80,0.05)';
    ctx.beginPath();
    ctx.roundRect(x - 12, y - 20, 24, 36, 3);
    ctx.fill();

    ctx.fillStyle = col;
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('CLIENTE', x, y + 35);

    const signalStrength = wallVisible ? (mode === MODES.normal ? 2 : 1) : 3;
    for (let i = 1; i <= 3; i++) {
      ctx.strokeStyle = i <= signalStrength ? col : (isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.15)');
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x + 8, y + 48, i * 4, -Math.PI * 0.8, -Math.PI * 0.2);
      ctx.stroke();
    }
  }
}

function drawLabels() {
  const midX = wallVisible ? (ROUTER.x + WALL_X) / 2 : (ROUTER.x + CLIENT.x) / 2;
  const cyclesViz = mode === MODES.normal ? 4 : mode === MODES.fast ? 6 : 8;

  ctx.fillStyle = mode.color;
  ctx.font = '500 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`λ = ${mode.waveLen}`, midX, H / 2 - 32);

  ctx.fillStyle = PALETTE.textMuted;
  ctx.font = '10px sans-serif';
  ctx.fillText(`f = ${mode.freq}  ·  ${cyclesViz} ciclos visibles`, midX, H / 2 - 18);

  if (!wallVisible) {
    const dist = CLIENT.x - ROUTER.x - 44;
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([3,3]);
    ctx.beginPath();
    ctx.moveTo(ROUTER.x + 24, H / 2 + 55);
    ctx.lineTo(CLIENT.x - 22, H / 2 + 55);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PALETTE.textMuted;
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`~10 m (simulado)`, (ROUTER.x + CLIENT.x) / 2, H / 2 + 68);
  }
}

function updateStats() {
  const base = wallVisible ? (mode === MODES.normal ? -58 : mode === MODES.fast ? -68 : -78) : (mode === MODES.normal ? -45 : mode === MODES.fast ? -52 : -58);
  rssi = base + Math.round(Math.sin(t * 0.3) * 2);
  document.getElementById('s-freq').textContent = mode.freq;
  document.getElementById('s-wave').textContent = mode.waveLen;
  document.getElementById('s-pen').textContent = mode.pen;
  const el = document.getElementById('s-rssi');
  el.textContent = rssi + ' dBm';
  el.style.color = rssi >= -55 ? '#1D9E75' : rssi >= -70 ? '#EF9F27' : '#E24B4A';
}

function frame() {
  if (playing) t += 0.016;
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawRipples();
  drawSineWave();
  drawWall();
  drawPackets();
  drawDevice(ROUTER.x, ROUTER.y, true);
  drawDevice(CLIENT.x, CLIENT.y, false);
  drawLabels();
  updateStats();
  requestAnimationFrame(frame);
}

function togglePlay() {
  playing = !playing;
  const btn = document.getElementById('btn-play');
  btn.innerHTML = playing
    ? '<i class="ti ti-player-pause" aria-hidden="true"></i> Pausar'
    : '<i class="ti ti-player-play" aria-hidden="true"></i> Reanudar';
}

function setMode(m) {
  mode = MODES[m];
  packets = [];
  document.getElementById('info-badge').textContent = mode.info;
}

function toggleWall() {
  wallVisible = !wallVisible;
  packets = [];
  document.getElementById('wall-btn-txt').textContent = wallVisible ? 'Quitar pared' : 'Agregar pared';
}

if (ctx.roundRect === undefined) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    this.beginPath();
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r);
    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r);
    this.quadraticCurveTo(x, y, x + r, y);
    this.closePath();
  };
}

frame();
</script>
