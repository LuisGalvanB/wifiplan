
<h2 class="sr-only">Simulación animada de pérdida de señal RF al atravesar diferentes materiales de construcción</h2>

<canvas id="wc" style="width:100%;display:block;border-radius:10px;"></canvas>

<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;">
  <button id="btn-play" onclick="togglePlay()" style="font-size:13px;min-width:90px;">⏸ Pausar</button>
  <span style="font-size:12px;color:var(--color-text-secondary);margin-left:4px;">Obstáculo activo:</span>
  <button onclick="setMat('concrete')" id="mb-concrete" style="font-size:12px;" class="mat-btn active-mat">🧱 Concreto −15 dB</button>
  <button onclick="setMat('glass')"    id="mb-glass"    style="font-size:12px;" class="mat-btn">🪟 Vidrio −3 dB</button>
  <button onclick="setMat('wood')"     id="mb-wood"     style="font-size:12px;" class="mat-btn">🚪 Madera −5 dB</button>
  <button onclick="setMat('metal')"    id="mb-metal"    style="font-size:12px;" class="mat-btn">⚙️ Metal −20 dB</button>
  <button onclick="setMat('multi')"    id="mb-multi"    style="font-size:12px;" class="mat-btn">📐 Multi-pared</button>
</div>

<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;">
  <div style="background:var(--color-background-secondary);border-radius:8px;padding:8px 10px;">
    <div style="font-size:11px;color:var(--color-text-secondary);">TX (router)</div>
    <div id="st-tx" style="font-size:16px;font-weight:500;color:var(--color-text-primary);font-family:monospace;">20 dBm</div>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:8px;padding:8px 10px;">
    <div style="font-size:11px;color:var(--color-text-secondary);">Pérdida en pared</div>
    <div id="st-loss" style="font-size:16px;font-weight:500;font-family:monospace;">−15 dB</div>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:8px;padding:8px 10px;">
    <div style="font-size:11px;color:var(--color-text-secondary);">RSSI cliente</div>
    <div id="st-rssi" style="font-size:16px;font-weight:500;font-family:monospace;">−55 dBm</div>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:8px;padding:8px 10px;">
    <div style="font-size:11px;color:var(--color-text-secondary);">Calidad señal</div>
    <div id="st-qual" style="font-size:16px;font-weight:500;">Excelente</div>
  </div>
</div>

<style>
.mat-btn { transition: all 0.12s; }
.active-mat { outline: 2px solid var(--color-border-info); background: var(--color-background-info); color: var(--color-text-info); }
</style>

<script>
const wc = document.getElementById('wc');
const cx = wc.getContext('2d');
const DPR = window.devicePixelRatio || 1;

function resize() {
  const W0 = wc.parentElement.offsetWidth || 680;
  const H0 = 340;
  wc.width  = W0 * DPR; wc.height = H0 * DPR;
  wc.style.width  = W0 + 'px'; wc.style.height = H0 + 'px';
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  return { W: W0, H: H0 };
}

let dims = resize();
let W = dims.W, H = dims.H;

const dk = matchMedia('(prefers-color-scheme:dark)').matches;
const BG   = dk ? '#0C1220' : '#F0F4FF';
const GRID = dk ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,120,0.04)';
const TXT  = dk ? '#D0D8E8' : '#1A2436';
const TXTs = dk ? '#6A7A90' : '#6A7A90';
const ROOM = dk ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,80,0.03)';
const RLINE= dk ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,80,0.1)';

const MATS = {
  concrete: { name:'Concreto',  att:15, col:'#8B7355', lw:14, desc:'Pared de concreto/ladrillo — pérdida típica 12–15 dB', rule:'Regla práctica: cada pared de concreto divide la señal por ~30×' },
  glass:    { name:'Vidrio',    att:3,  col:'#7BB8D8', lw:6,  desc:'Ventana o muro cortina de vidrio — pérdida 2–4 dB',    rule:'Regla práctica: el vidrio apenas atenúa — casi transparente al RF' },
  wood:     { name:'Madera',    att:5,  col:'#C89050', lw:8,  desc:'Puerta o tabique de madera/drywall — pérdida 3–5 dB',  rule:'Regla práctica: oficinas con drywall — pérdida similar al vidrio grueso' },
  metal:    { name:'Metal',     att:20, col:'#808898', lw:16, desc:'Pared/estantería metálica — pérdida 15–25 dB',          rule:'Regla práctica: el metal bloquea casi completamente el RF — zona muerta' },
  multi:    { name:'Multi-pared',att:0, col:'#888888', lw:0,  desc:'Señal atravesando 3 materiales distintos',             rule:'Acumulativo: cada obstáculo suma sus dB de pérdida' },
};

let mat = 'concrete';
let playing = true;
let t = 0;
const TX_DBM = 20;

// Wall X positions (relative 0–1)
const WALL_X = 0.42;
const WALL_X2 = 0.58;
const WALL_X3 = 0.72;
const AP_X = 0.12;
const CL_X = 0.88;

function setMat(m) {
  mat = m;
  document.querySelectorAll('.mat-btn').forEach(b => b.classList.remove('active-mat'));
  document.getElementById('mb-' + m).classList.add('active-mat');
  t = 0;
  updateStats();
}

function togglePlay() {
  playing = !playing;
  document.getElementById('btn-play').textContent = playing ? '⏸ Pausar' : '▶ Reanudar';
}

function totalLoss() {
  if (mat === 'multi') return MATS.concrete.att + MATS.glass.att + MATS.wood.att;
  return MATS[mat].att;
}

function fspl(dist_m, freq_ghz) {
  return 20 * Math.log10(dist_m) + 20 * Math.log10(freq_ghz) + 20 * Math.log10(4 * Math.PI / 0.3) - 30;
}

function rssiQual(r) {
  if (r >= -55) return { q: 'Excelente', c: '#1D9E75' };
  if (r >= -67) return { q: 'Buena',     c: '#3BB85A' };
  if (r >= -75) return { q: 'Aceptable', c: '#EF9F27' };
  if (r >= -85) return { q: 'Débil',     c: '#E06040' };
  return               { q: 'Sin señal', c: '#E84040' };
}

function updateStats() {
  const loss = totalLoss();
  const dist = (CL_X - AP_X) * 20;
  const path = fspl(dist, 5);
  const rssi = Math.round(TX_DBM - path - loss);
  const { q, c } = rssiQual(rssi);
  document.getElementById('st-tx').textContent   = TX_DBM + ' dBm';
  document.getElementById('st-loss').textContent = '−' + loss + ' dB';
  document.getElementById('st-loss').style.color = loss >= 15 ? '#E84040' : loss >= 8 ? '#EF9F27' : '#1D9E75';
  document.getElementById('st-rssi').textContent = rssi + ' dBm';
  document.getElementById('st-rssi').style.color = c;
  document.getElementById('st-qual').textContent = q;
  document.getElementById('st-qual').style.color = c;
}

function hexRGB(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}

function drawScene() {
  cx.fillStyle = BG; cx.fillRect(0, 0, W, H);

  // grid
  cx.strokeStyle = GRID; cx.lineWidth = 1;
  for (let x = 0; x < W; x += 28) { cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,H); cx.stroke(); }
  for (let y = 0; y < H; y += 28) { cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke(); }

  // Two rooms
  const wallPx = WALL_X * W;
  cx.fillStyle = ROOM;
  cx.fillRect(0, 0, wallPx, H);
  cx.fillRect(wallPx, 0, W - wallPx, H);
  cx.strokeStyle = RLINE; cx.lineWidth = 1;
  cx.strokeRect(0, 0, wallPx, H);
  cx.strokeRect(wallPx, 0, W - wallPx, H);

  // Room labels
  cx.fillStyle = TXTs; cx.font = '11px sans-serif'; cx.textAlign = 'center';
  if (mat !== 'multi') {
    cx.fillText('Habitación A', wallPx * 0.5, 18);
    cx.fillText('Habitación B', wallPx + (W - wallPx) * 0.5, 18);
  } else {
    cx.fillText('Zona A', WALL_X * W * 0.5, 18);
    cx.fillText('Zona B', (WALL_X + WALL_X2) / 2 * W, 18);
    cx.fillText('Zona C', (WALL_X2 + WALL_X3) / 2 * W, 18);
    cx.fillText('Zona D', (WALL_X3 + 1) / 2 * W, 18);
  }
}

function drawWalls() {
  if (mat === 'multi') {
    drawWall(WALL_X  * W, MATS.concrete, 'Concreto\n−15 dB');
    drawWall(WALL_X2 * W, MATS.glass,    'Vidrio\n−3 dB');
    drawWall(WALL_X3 * W, MATS.wood,     'Madera\n−5 dB');
  } else {
    drawWall(WALL_X * W, MATS[mat], MATS[mat].name + '\n−' + MATS[mat].att + ' dB');
  }
}

function drawWall(wx, m, label) {
  const [r, g, b] = hexRGB(m.col);
  cx.fillStyle = `rgba(${r},${g},${b},0.55)`;
  cx.fillRect(wx - m.lw/2, 0, m.lw, H);
  cx.strokeStyle = `rgba(${r},${g},${b},0.9)`;
  cx.lineWidth = 1.5;
  cx.strokeRect(wx - m.lw/2, 0, m.lw, H);

  // hatching for texture
  cx.strokeStyle = `rgba(${r},${g},${b},0.35)`;
  cx.lineWidth = 1;
  for (let y = 0; y < H; y += 10) {
    cx.beginPath(); cx.moveTo(wx - m.lw/2, y); cx.lineTo(wx + m.lw/2, y + 8); cx.stroke();
  }

  // label
  cx.fillStyle = `rgba(${r},${g},${b},1)`;
  cx.font = 'bold 10px sans-serif'; cx.textAlign = 'center';
  const lines = label.split('\n');
  lines.forEach((l, i) => cx.fillText(l, wx, H - 22 + i * 13));
}

function drawDevice(x, y, isAP) {
  const col = isAP ? '#378ADD' : '#1D9E75';
  const bg  = isAP ? (dk ? '#0C2040' : '#E6F1FB') : (dk ? '#0C2820' : '#E1F5EE');
  cx.fillStyle = bg; cx.strokeStyle = col; cx.lineWidth = 2;
  cx.beginPath(); cx.roundRect(x - 18, y - 18, 36, 36, 6); cx.fill(); cx.stroke();
  if (isAP) {
    // antenna lines
    cx.strokeStyle = col; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(x - 6, y - 18); cx.lineTo(x - 9, y - 30); cx.stroke();
    cx.beginPath(); cx.moveTo(x + 6, y - 18); cx.lineTo(x + 9, y - 30); cx.stroke();
  } else {
    // phone shape hint
    cx.fillStyle = dk ? 'rgba(255,255,255,0.08)' : 'rgba(0,100,0,0.05)';
    cx.beginPath(); cx.roundRect(x - 7, y - 12, 14, 20, 2); cx.fill();
  }
  cx.fillStyle = col; cx.font = 'bold 9px sans-serif'; cx.textAlign = 'center';
  cx.fillText(isAP ? 'AP' : 'Cliente', x, y + 4);
}

function drawWaves() {
  const apX = AP_X * W;
  const wallX1 = WALL_X  * W;
  const wallX2 = WALL_X2 * W;
  const wallX3 = WALL_X3 * W;
  const clX  = CL_X * W;
  const midY  = H / 2;

  const segments = mat === 'multi'
    ? [
        { x0: apX + 20,   x1: wallX1 - 7,  attSoFar: 0 },
        { x0: wallX1 + 7, x1: wallX2 - 3,  attSoFar: 15 },
        { x0: wallX2 + 3, x1: wallX3 - 4,  attSoFar: 18 },
        { x0: wallX3 + 4, x1: clX - 20,    attSoFar: 23 },
      ]
    : [
        { x0: apX + 20,          x1: wallX1 - MATS[mat].lw/2 - 2, attSoFar: 0 },
        { x0: wallX1 + MATS[mat].lw/2 + 2, x1: clX - 20,          attSoFar: MATS[mat].att },
      ];

  const maxAtt = mat === 'multi' ? 23 : MATS[mat].att;

  segments.forEach(seg => {
    const attFrac = seg.attSoFar / (maxAtt + 1e-9);
    const ampScale = Math.pow(10, -seg.attSoFar / 40);
    const baseAmp  = H * 0.28 * ampScale;
    const col = attFrac < 0.3 ? '#1D9E75' : attFrac < 0.6 ? '#EF9F27' : '#E84040';
    const [r, g, b] = hexRGB(col);

    cx.save();
    cx.beginPath(); cx.rect(seg.x0, 0, seg.x1 - seg.x0, H); cx.clip();

    // main wave
    cx.beginPath();
    for (let px = seg.x0; px <= seg.x1; px += 2) {
      const norm = (px - seg.x0) / (seg.x1 - seg.x0);
      const fade = Math.sin(norm * Math.PI);
      const amp  = baseAmp * fade;
      const wy   = midY - amp * Math.sin(6 * Math.PI * 2 * norm - t * 2.8);
      if (px === seg.x0) cx.moveTo(px, wy); else cx.lineTo(px, wy);
    }
    cx.strokeStyle = `rgba(${r},${g},${b},0.9)`; cx.lineWidth = 2.5; cx.stroke();

    // ghost envelope
    cx.beginPath();
    for (let px = seg.x0; px <= seg.x1; px += 3) {
      const norm = (px - seg.x0) / (seg.x1 - seg.x0);
      const amp  = baseAmp * Math.sin(norm * Math.PI);
      if (px === seg.x0) cx.moveTo(px, midY - amp); else cx.lineTo(px, midY - amp);
    }
    for (let px = seg.x1; px >= seg.x0; px -= 3) {
      const norm = (px - seg.x0) / (seg.x1 - seg.x0);
      const amp  = baseAmp * Math.sin(norm * Math.PI);
      cx.lineTo(px, midY + amp);
    }
    cx.closePath();
    cx.fillStyle = `rgba(${r},${g},${b},0.06)`; cx.fill();

    // RSSI label above segment
    const mx = (seg.x0 + seg.x1) / 2;
    const dist_m = ((mx / W) * (CL_X - AP_X) * 20);
    const path = fspl(Math.max(0.5, dist_m), 5);
    const rssi_here = Math.round(TX_DBM - path - seg.attSoFar);
    cx.fillStyle = col; cx.font = 'bold 10px monospace'; cx.textAlign = 'center';
    cx.fillText(rssi_here + ' dBm', mx, midY - baseAmp * 0.72 - 8);

    cx.restore();
  });

  // Animated packet dot traveling left → right
  const totalWidth = clX - apX - 40;
  const phase = (t * 0.28) % 1;
  const dotX = apX + 20 + phase * totalWidth;
  let dotAtt = 0;
  if (mat === 'multi') {
    if (dotX > wallX3 + 4) dotAtt = 23;
    else if (dotX > wallX2 + 3) dotAtt = 18;
    else if (dotX > wallX1 + 7) dotAtt = 15;
  } else {
    if (dotX > wallX1 + MATS[mat].lw/2 + 2) dotAtt = MATS[mat].att;
  }
  const dotFrac = dotAtt / (maxAtt + 1e-9);
  const dotCol = dotFrac < 0.3 ? '#1D9E75' : dotFrac < 0.6 ? '#EF9F27' : '#E84040';
  cx.beginPath(); cx.arc(dotX, midY, 5, 0, Math.PI * 2);
  cx.fillStyle = dotCol; cx.fill();
  cx.strokeStyle = dk ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.2)'; cx.lineWidth = 1; cx.stroke();
  cx.fillStyle = dotCol; cx.font = 'bold 8px sans-serif'; cx.textAlign = 'center';
  cx.fillText('DATA', dotX, midY - 9);
}

function drawAttenBox() {
  const loss = totalLoss();
  const bx = 8, by = H - 56, bw = 220, bh = 48;
  cx.fillStyle = dk ? 'rgba(10,16,30,0.85)' : 'rgba(240,244,255,0.9)';
  cx.strokeStyle = dk ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,80,0.12)';
  cx.lineWidth = 0.5; cx.beginPath(); cx.roundRect(bx, by, bw, bh, 7); cx.fill(); cx.stroke();
  cx.fillStyle = TXTs; cx.font = '10px sans-serif'; cx.textAlign = 'left';
  if (mat !== 'multi') {
    cx.fillText(MATS[mat].desc, bx + 8, by + 14);
    cx.fillStyle = dk ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,80,0.55)';
    cx.fillText(MATS[mat].rule, bx + 8, by + 28);
  } else {
    cx.fillText('Pérdida acumulada: −' + loss + ' dB total', bx + 8, by + 14);
    cx.fillStyle = dk ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,80,0.55)';
    cx.fillText('Concreto −15 + Vidrio −3 + Madera −5 = −23 dB', bx + 8, by + 28);
  }
  // loss bar
  const barX = bx + 8, barY = by + 36, barW = bw - 16, barH = 6;
  cx.fillStyle = dk ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,80,0.08)';
  cx.beginPath(); cx.roundRect(barX, barY, barW, barH, 3); cx.fill();
  const pct = Math.min(1, loss / 25);
  const barCol = pct < 0.3 ? '#1D9E75' : pct < 0.6 ? '#EF9F27' : '#E84040';
  cx.fillStyle = barCol;
  cx.beginPath(); cx.roundRect(barX, barY, barW * pct, barH, 3); cx.fill();
}

function drawMaterials() {
  // Mini legend top-right
  const mats = mat === 'multi'
    ? [{ m: MATS.concrete, label: 'Concreto −15 dB' }, { m: MATS.glass, label: 'Vidrio −3 dB' }, { m: MATS.wood, label: 'Madera −5 dB' }]
    : [{ m: MATS[mat], label: MATS[mat].name + ' −' + MATS[mat].att + ' dB' }];

  mats.forEach(({ m, label }, i) => {
    const lx = W - 170, ly = 10 + i * 20;
    const [r, g, b] = hexRGB(m.col);
    cx.fillStyle = `rgba(${r},${g},${b},0.6)`;
    cx.fillRect(lx, ly + 3, 14, 10);
    cx.strokeStyle = m.col; cx.lineWidth = 1; cx.strokeRect(lx, ly + 3, 14, 10);
    cx.fillStyle = TXTs; cx.font = '10px sans-serif'; cx.textAlign = 'left';
    cx.fillText(label, lx + 18, ly + 12);
  });
}

function frame() {
  if (playing) t += 0.016;
  ({ W, H } = resize());
  drawScene();
  drawWalls();
  drawWaves();
  drawDevice(AP_X * W, H / 2, true);
  drawDevice(CL_X * W, H / 2, false);
  drawAttenBox();
  drawMaterials();
  requestAnimationFrame(frame);
}

if (cx.roundRect === undefined) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    this.beginPath();
    this.moveTo(x + r, y); this.arcTo(x+w, y, x+w, y+h, r);
    this.arcTo(x+w, y+h, x, y+h, r); this.arcTo(x, y+h, x, y, r);
    this.arcTo(x, y, x+w, y, r); this.closePath();
  };
}

updateStats();
requestAnimationFrame(frame);
</script>
